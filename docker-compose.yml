
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-data-analyst-backend
    ports:
      - "8080:8080"
    environment:
      COHERE_API_KEY: ${COHERE_API_KEY:?Set COHERE_API_KEY in .env}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: ai-data-analyst-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
